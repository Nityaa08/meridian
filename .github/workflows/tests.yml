name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # requirements.txt has no PyTorch; the tests use a fake embedder and fake
      # HTTP services, so no network, Groq key or model download is needed.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -v
